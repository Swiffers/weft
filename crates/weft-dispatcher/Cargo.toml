[package]
name = "weft-dispatcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
weft-core = { workspace = true }
# The dispatcher is the compile site of every version build: it compiles
# the uploaded source itself (the definition, the hashes, the staged docker
# build context) and hands the image builds to the platform. That needs the
# full `build` feature (codegen, worker_image, the hash path) and a weft
# workspace on disk, resolved through `weft_catalog::weft_repo_root`
# (WEFT_REPO_ROOT in a built image). DIRECT path dep, NOT
# `workspace = true`, to keep feature control explicit.
weft-compiler = { path = "../weft-compiler", features = ["build"] }
# The catalog a version compiles against (`build::source`).
weft-catalog = { workspace = true }
weft-assets = { workspace = true }
weft-journal = { workspace = true }
weft-task-store = { workspace = true, features = ["serve", "migrate"] }
weft-access-store = { workspace = true }
weft-broker-client = { path = "../weft-broker-client" }
weft-platform-traits = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
# The events receiver forwards raw push bodies to the broker base64'd
# (signatures hash the exact bytes; the wrapper stays JSON).
base64 = { workspace = true }
hex = "0.4"
# The files door decodes a link's path before it checks it as a storage key.
percent-encoding = "2"
# Materialize uploaded source rows to a temp dir for the compile + stage
# (the dispatcher is a compile site for image builds).
tempfile = { workspace = true }
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack" }

[features]
test-helpers = []

[dev-dependencies]
weft-dispatcher = { path = ".", features = ["test-helpers"] }
# The broker's own apply insert, so a test issues an apply the way a
# worker does in production.
weft-broker = { path = "../weft-broker" }
weft-platform-traits = { workspace = true, features = ["test-helpers"] }
# `#[weft_db_macros::test]` hands each Layer-3 test a fresh database of
# its own on $DATABASE_URL, dropped after.
weft-db-macros = { workspace = true }
weft-task-store = { workspace = true, features = ["serve", "migrate", "test-helpers"] }
# `test-util`: the paused virtual clock the wake-loop tests (`pg_wake`)
# run on, so their safety ticks pass without real waiting.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
