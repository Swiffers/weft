# ExecPython runs each script in a `python3` process the worker starts
# (see mod.rs), so the machine the worker runs on needs the interpreter
# and its standard library, and nothing at build time.

[dependencies]

[[needs]]
name = "python3"
check = ["python3", "--version"]

[needs.install.apt]
default = ["python3"]

[needs.install.dnf]
default = ["python3"]

[needs.install.apk]
default = ["python3"]

[needs.install.brew]
default = ["python"]
