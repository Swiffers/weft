[package]
name = "weft-access-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
# The token exchanges (OAuth code/refresh, MintJwt exchange), test calls,
# and resource lookups all go out through the shared auth pipeline in
# weft-core (`access::client`), so a lookup is authenticated exactly like
# a worker call.
reqwest = { workspace = true }
# MintJwt acquisitions (GitHub App class) sign RS256 over the pasted private
# key (`weft_core::jwt`), exchanged for the working token at resolution time.
weft-core = { workspace = true, features = ["jwt"] }
# `SchemaGroup` + `apply_groups`: this crate declares its schema as a group
# the boot's schema guard applies alongside every other module's, and its
# documents' rederive steps (`documents::Rederived`) need `migrate`.
weft-task-store = { workspace = true, features = ["migrate"] }
# Per-subscription secret mint (the token a push must echo back).
rand = "0.10"
# At-rest sealing of stored credential material (crypt.rs).
aes-gcm = { workspace = true }
# Sealing connections to another install (transfer.rs): ECDH on P-256,
# its secret drawn into an AES key with HKDF-SHA256.
p256 = { workspace = true, features = ["ecdh", "getrandom"] }
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack" }

[dev-dependencies]
# `#[weft_db_macros::test]` hands each Layer-3 test a fresh database of
# its own on $DATABASE_URL, dropped after.
weft-db-macros = { workspace = true }
weft-task-store = { workspace = true, features = ["migrate", "test-helpers"] }
weft-core = { workspace = true }
# The layer-3 tests' fake provider is a tiny in-process HTTP server.
axum = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
