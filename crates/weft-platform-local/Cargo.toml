[package]
name = "weft-platform-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The local implementation of the translation layer's traits
# (`weft-platform-traits`): plain processes and the local Docker daemon.

[features]
default = []
# The fakes (`docker::fake`) for other crates' tests.
test-helpers = []

[dependencies]
weft-platform-traits = { workspace = true }
weft-core = { workspace = true }
# Container log instants (`docker logs --timestamps`).
chrono = { workspace = true }
# The `alarm` table the local alarm keeps its wakes in.
weft-task-store = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["process"] }
uuid = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
# One pass of a folder's sync (`folders`), and the walk it watches by.
weft-assets = { workspace = true }
# A folder's change events (`folders`).
notify = "8"
hex = "0.4"
# Signals to worker processes (`processes`).
libc = "0.2"
getrandom = { workspace = true }
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The database tests build their tables with `apply_groups`.
weft-task-store = { workspace = true, features = ["migrate", "test-helpers"] }
axum = { workspace = true }
weft-platform-traits = { workspace = true, features = ["test-helpers"] }
# `#[weft_db_macros::test]` hands each Layer-3 test a fresh database of
# its own on $DATABASE_URL, dropped after.
weft-db-macros = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
# `weft_core::stress_test!` expands to it.
futures = { workspace = true }

[lints]
workspace = true
