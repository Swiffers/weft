[package]
name = "weft-task-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The middleware that keeps a process's watch listening while it answers
# a request (`pg_signal::keep_listening`), for the processes that serve.
serve = ["dep:axum", "dep:http-body"]

[dependencies]
# Only for stamping a generated migration's file name with the date it was
# written (`schema_guard::file_per_group`).
chrono = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, optional = true }
http-body = { version = "1", optional = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "uuid", "tls-rustls"] }
tokio = { workspace = true }
tokio-util = { version = "0.7" }
tracing = { workspace = true }
uuid = { workspace = true }
weft-core = { workspace = true }
# What the outbox tells news through (`announce::tell_news_through`).
weft-platform-traits = { workspace = true }
weft-workspace-hack = { version = "0.1", path = "../weft-workspace-hack" }

[dev-dependencies]
# The tests drive `pg_signal::keep_listening`, which is behind `serve`. A
# dev-dependency on the crate itself turns it on for every test build, so
# the ordinary run and the database run build the same library.
weft-task-store = { path = ".", features = ["serve"] }
# Driving `pg_signal::keep_listening` in the database tests (`oneshot`).
tower = { workspace = true, features = ["util"] }
# `test-util` enables tokio's paused virtual clock (start_paused +
# advance) so the timing tests run deterministically without real
# sleeps.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
# `#[sqlx::test]` (macros + migrate features) spins up a fresh isolated
# Postgres database per test against $DATABASE_URL and drops it after, for
# the Layer-3 DB-logic tests (claims, reruns, signals, terminal waits,
# the schema guard). Only nextest's `db` profile runs them
# (`scripts/run-db-tests.sh`), since without a DATABASE_URL they fail.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "uuid", "macros", "migrate"] }
# The fake alarm the booking tests read the wakes set and cancelled from.
weft-platform-traits = { workspace = true, features = ["test-helpers"] }
# Counting the alert lines a stuck failure logs (tests/db/unanswered.rs).
tracing-subscriber = { workspace = true }

[lints]
workspace = true
