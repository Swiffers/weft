# Build the mdBook in docs/ and publish it to GitHub Pages.
#
# The book's source is plain markdown that also reads correctly on github.com,
# so this workflow only adds search, navigation, and rendered mermaid. A broken
# internal link fails the build rather than shipping: `create-missing` is off in
# book.toml, so a SUMMARY entry with no file is an error here.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # docs/theme/highlight-weft.js is a link to this file.
      - "packages/weft-syntax/highlight-weft.js"
      - ".github/workflows/docs.yml"
  pull_request:
    # Into main only: `poc` (the retired proof of concept) carries a
    # different docs tree this build was never written for.
    branches: [main]
    paths:
      - "docs/**"
      - "packages/weft-syntax/highlight-weft.js"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run supersedes a waiting one, but never
# cancels a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Prebuilt release binaries, a few megabytes each: downloading them
      # takes as long as restoring a cache would, so nothing is cached and
      # a version bump here is the whole upgrade. scripts/check-pins.sh
      # reads both versions from these two lines.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: 0.5.4
          MDBOOK_MERMAID_VERSION: 0.17.1
        run: |
          set -euo pipefail
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$bin"
          curl -fsSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$bin"

      - name: Build
        run: |
          cd docs
          mdbook-mermaid install .
          mdbook build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    # Pull requests build the book to catch dead links, and stop there.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
