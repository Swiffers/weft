[package]
name = "llm"

# The generic language-model nodes: an Access node per service (the
# one place its connection is picked) and Model nodes that name a model
# on that wired connection and emit an `LlmProvider` value (plus
# CustomProvider, which keeps its own optional connection), a shared
# parameter node, a tool declaration node, the inference nodes
# (buffered `LlmInference`, `LlmInferenceJson` for a JSON answer held
# to a declared type, live `LlmStream`), and the provider-agnostic
# ChatHistoryAppend. The ChatHistory / ToolCall / LlmProvider types are
# declared at this root.
#
# minillmlib carries the wire dialects (OpenAI-compatible, native
# Anthropic) and accepts an injected HTTP client
# (`GeneratorInfo::with_http_client`), which is how every call rides
# the opened connection's client; the nodes need no HTTP client and no
# cost bookkeeping of their own.
[dependencies]
async-trait = "0.1"
minillmlib = "0.6.1"
serde_json = "1"
tokio = "1"
